name: CI

# StoryForge CI(Phase 3.3)
# 在 push / PR 时跑全套守护:架构铁律 + 注册表完整性 + 文档一致性 + 类型 + 测试 + 构建。
# 任何一项失败则红,阻止"屎山复发"与回归。

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      # Run the canonical full CLI gate once. Do not add a second full-delivery
      # workflow to repeat coverage/build for the same PR head.
      - name: 完整工程检查（单次统一入口）
        run: npm run ci

      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      - name: 生产版模型与嵌入代理设置
        run: PLAYWRIGHT_PRODUCTION_PREVIEW=1 npx playwright test tests/e2e/settings-proxy.spec.ts tests/e2e/codex-provider.spec.ts

      - name: 核心用户路径浏览器冒烟
        run: npm run ci:e2e
