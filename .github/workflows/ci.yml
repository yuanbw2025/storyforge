name: PR checks
on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened, labeled]

permissions:
  contents: read

concurrency:
  group: changed-files-pr-${{ github.event.action == 'labeled' && github.event.label.name != 'run-scoped-check' && github.run_id || github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  changed-files:
    # A skipped job must not satisfy the required check or cancel a real run.
    if: github.event.action != 'labeled' || github.event.label.name == 'run-scoped-check'
    name: ${{ github.event.action == 'labeled' && github.event.label.name != 'run-scoped-check' && 'Unrelated label' || 'Changed files' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 2
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - name: Check the PR changes on the merge result
        env:
          PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: '1'
          ELECTRON_SKIP_BINARY_DOWNLOAD: '1'
        run: node scripts/quality/check-merge-scope.mjs HEAD^1 --install
