name: Verify signed Android release upgrade
on:
  workflow_dispatch:
  workflow_call:
  pull_request:
    paths:
      - '.github/workflows/client-release-upgrade.yml'
      - 'android/app/src/androidTest/java/com/storyforge/client/ClientUpgradeTest.java'
      - 'tests/helpers/native-upgrade-fixture.ts'
permissions:
  contents: read
env:
  PREVIOUS_CLIENT_VERSION: 4.0.4
jobs:
  signed-apk-upgrade:
    permissions:
      contents: write # GitHub requires repository write access to read unpublished release assets.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21
      - uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools platforms;android-36 build-tools;35.0.0'
      - name: Fetch the locally signed release test set without uploading the signing key
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version=$(node -p "require('./package.json').version")
          mkdir -p release-test
          gh release download "v$PREVIOUS_CLIENT_VERSION" --pattern "StoryForge-$PREVIOUS_CLIENT_VERSION-android.apk" --output release-test/upgrade-test-old.apk
          gh release download "v$version" --pattern "StoryForge-$version-android.apk" --output release-test/upgrade-test-new.apk
          gh release download "v$version" --pattern 'upgrade-test-runner.apk' --dir release-test
      - name: Enable emulator acceleration
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          arch: x86_64
          target: google_apis
          disable-animations: true
          script: bash scripts/distribution/test-release-apk-upgrade.sh
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: signed-android-upgrade-evidence
          path: release-test/*.txt
          retention-days: 14
