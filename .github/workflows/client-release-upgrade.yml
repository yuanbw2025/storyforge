name: Verify signed Android release upgrade
on:
  workflow_dispatch:
  workflow_call:
    inputs:
      client-artifact:
        description: 'Test the immutable client-android artifact produced by this release run'
        type: boolean
        default: false
permissions:
  contents: read
env:
  PREVIOUS_CLIENT_VERSION: 4.0.5
jobs:
  signed-apk-upgrade:
    permissions:
      contents: write # GitHub requires repository write access to read unpublished release assets.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21
      - uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools platforms;android-36 build-tools;35.0.0'
      - uses: actions/download-artifact@v4
        if: ${{ inputs.client-artifact }}
        with:
          name: client-android
          path: release-test/current-client/
      - name: Fetch the locally signed release test set without uploading the signing key
        env:
          GH_TOKEN: ${{ github.token }}
          USE_CLIENT_ARTIFACT: ${{ inputs.client-artifact }}
        run: |
          version=$(node -p "require('./package.json').version")
          mkdir -p release-test
          gh release download "v$PREVIOUS_CLIENT_VERSION" --pattern "StoryForge-$PREVIOUS_CLIENT_VERSION-android.apk" --output release-test/upgrade-test-old.apk
          if [ "$USE_CLIENT_ARTIFACT" = true ]; then
            cp "release-test/current-client/StoryForge-$version-android.apk" release-test/upgrade-test-new.apk
          else
            gh release download "v$version" --pattern "StoryForge-$version-android.apk" --output release-test/upgrade-test-new.apk
          fi
          gh release download "v$version" --pattern 'upgrade-test-runner.apk' --dir release-test
      - name: Verify exact source before installing the new signed APK
        env:
          RELEASE_SOURCE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          version=$(node -p "require('./package.json').version")
          python3 scripts/distribution/verify-android-source.py verify release-test/upgrade-test-new.apk --commit "$RELEASE_SOURCE_SHA" --tree "$(git rev-parse HEAD^{tree})" --version "$version" > release-test/source-check.json
      - name: Enable emulator acceleration
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          arch: x86_64
          target: google_apis
          disable-animations: true
          script: bash scripts/distribution/test-release-apk-upgrade.sh
      - name: Freeze the exact upgrade-tested APK and four successful phases
        env:
          RELEASE_SOURCE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          version=$(node -p "require('./package.json').version")
          python3 scripts/distribution/verify-android-source.py record-tested release-test/upgrade-test-new.apk --commit "$RELEASE_SOURCE_SHA" --tree "$(git rev-parse HEAD^{tree})" --version "$version" --preflight release-test/source-check.json --phases release-test > release-test/tested-release.json
      - uses: actions/upload-artifact@v4
        with:
          name: verified-android-release-input
          path: |
            release-test/upgrade-test-new.apk
            release-test/tested-release.json
            release-test/seed.txt
            release-test/baseline-restart.txt
            release-test/restore.txt
            release-test/restart.txt
          if-no-files-found: error
          retention-days: 14
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: signed-android-upgrade-evidence
          path: release-test/*.txt
          retention-days: 14
