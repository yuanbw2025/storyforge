name: Release Current Local Package

on:
  push:
    tags: ['v*']
  pull_request:
    paths:
      - 'scripts/distribution/**'
      - 'scripts/local-codex/**'
      - 'vite.config.ts'
      - 'package.json'
      - 'package-lock.json'
      - 'src/lib/ai/proxy-endpoints.ts'
      - 'src/components/settings/AIConfigPanel.tsx'
      - 'src/components/settings/EmbeddingConfigCard.tsx'
      - '.github/workflows/release.yml'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag matching package.json, for example v4.0.0'
        required: true
        type: string
      prerelease:
        description: 'Mark as prerelease'
        default: false
        type: boolean

permissions:
  contents: read

concurrency:
  group: local-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release-checks:
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - id: cli
            script: ci
          - id: browser
            script: ci:e2e
    env:
      PLAYWRIGHT_FROZEN_WORKSPACE: "1"
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Record exact source
        run: git rev-parse HEAD
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Install browser runtime
        if: matrix.id == 'browser'
        run: npx playwright install --with-deps chromium
      - name: Build production preview
        if: matrix.id == 'browser'
        run: npm run build
      - name: Verify production model and embedding proxies
        if: matrix.id == 'browser'
        run: PLAYWRIGHT_PRODUCTION_PREVIEW=1 npx playwright test tests/e2e/settings-proxy.spec.ts tests/e2e/codex-provider.spec.ts
      - name: Complete release checks
        run: npm run ${{ matrix.script }}
      - name: Preserve browser evidence
        if: ${{ !cancelled() && matrix.id == 'browser' }}
        uses: actions/upload-artifact@v4
        with:
          name: release-browser-${{ github.sha }}
          path: |
            test-results/
            playwright-report/
          if-no-files-found: ignore
          retention-days: 14
  clients:
    permissions:
      contents: write
    if: github.event_name != 'pull_request'
    uses: ./.github/workflows/clients.yml
    with:
      release: true
    secrets: inherit
  build:
    needs: release-checks
    if: ${{ !cancelled() && (github.event_name == 'pull_request' || needs.release-checks.result == 'success') }}
    runs-on: ubuntu-latest
    env:
      RELEASE_TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Verify release metadata
        if: github.event_name != 'pull_request'
        run: npm run check:release-metadata -- "${RELEASE_TAG}"
      - run: npm run test:distribution
      - name: Build local portable channel
        run: |
          npm run build:portable
          node scripts/distribution/notices.mjs
      - uses: actions/upload-artifact@v4
        with:
          name: distribution-web
          path: dist/
          retention-days: 5

  package:
    needs: build
    if: ${{ !cancelled() && needs.build.result == 'success' }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            target: windows-x64
          - os: ubuntu-latest
            target: linux-x64
          - os: macos-15
            target: macos-arm64
          - os: macos-15-intel
            target: macos-x64
    runs-on: ${{ matrix.os }}
    env:
      # Keep retained acceptance evidence readable during Windows checkout.
      GIT_CONFIG_COUNT: ${{ matrix.os == 'windows-latest' && '1' || '0' }}
      GIT_CONFIG_KEY_0: core.longpaths
      GIT_CONFIG_VALUE_0: 'true'
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - uses: actions/download-artifact@v4
        with:
          name: distribution-web
          path: dist/
      - name: Package verified official runtime
        run: python scripts/distribution/build-portable.py "${{ matrix.target }}"
      - name: Start the actual bundled runtime
        shell: bash
        run: |
          version=$(node -p "JSON.parse(require('fs').readFileSync('package.json')).version")
          python scripts/distribution/smoke-package.py "release/StoryForge-v${version}-${{ matrix.target }}.zip"
      - uses: actions/upload-artifact@v4
        with:
          name: portable-${{ matrix.target }}
          path: |
            release/*.zip
            release/*.sha256
          retention-days: 5

  publish:
    if: github.event_name != 'pull_request'
    needs: [package, clients, signed-upgrade]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      RELEASE_TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}
      PRERELEASE: ${{ github.event_name == 'workflow_dispatch' && inputs.prerelease || false }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/download-artifact@v4
        with:
          pattern: portable-*
          path: release-assets/
          merge-multiple: true
      - uses: actions/download-artifact@v4
        with:
          pattern: client-*
          path: release-assets/
          merge-multiple: true
      - name: Publish only after all target packages pass
        run: |
          git fetch origin main
          git merge-base --is-ancestor HEAD origin/main || { echo 'Release source must be merged into main before publication.'; exit 1; }
          if gh release view "${RELEASE_TAG}" --json isDraft --jq '.isDraft' > existing-release-state.txt 2>/dev/null; then
            test "$(cat existing-release-state.txt)" = true || { echo 'Published releases are immutable. Increment package.json and use a new tag.'; exit 1; }
          fi
          if git rev-parse -q --verify "refs/tags/${RELEASE_TAG}" >/dev/null; then
            test "$(git rev-list -n 1 "${RELEASE_TAG}")" = "$(git rev-parse HEAD)"
          else
            git tag "${RELEASE_TAG}"
            git push origin "${RELEASE_TAG}"
          fi
          cd release-assets
          sha256sum *.zip *.exe *.dmg *.apk *.yml *.blockmap > SHA256SUMS.txt
          sha256sum --check SHA256SUMS.txt
          cd ..
          notes=".github/release-notes/${RELEASE_TAG}.md"
          test -f "$notes"
          if ! gh release view "${RELEASE_TAG}" >/dev/null 2>&1; then
            gh release create "${RELEASE_TAG}" --draft --verify-tag --title "StoryForge ${RELEASE_TAG} · Windows / macOS / Android" --notes-file "$notes"
          fi
          gh release upload "${RELEASE_TAG}" release-assets/*.zip release-assets/*.exe release-assets/*.dmg release-assets/*.apk release-assets/*.yml release-assets/*.blockmap release-assets/SHA256SUMS.txt --clobber
          for asset in upgrade-test-old.apk upgrade-test-new.apk upgrade-test-runner.apk; do
            gh release delete-asset "${RELEASE_TAG}" "$asset" --yes 2>/dev/null || true
          done
          args=(--draft=false --notes-file "$notes")
          if [ "$PRERELEASE" = true ]; then args+=(--prerelease --latest=false); else args+=(--prerelease=false --latest); fi
          gh release edit "${RELEASE_TAG}" "${args[@]}"

  signed-upgrade:
    permissions:
      contents: write
    if: github.event_name != 'pull_request'
    needs: clients
    uses: ./.github/workflows/client-release-upgrade.yml
