name: AVG media validation
on: workflow_dispatch
permissions:
  contents: read
jobs:
  avg-media-experimental:
    name: AVG 媒资实验路径（隔离浏览器）
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      PLAYWRIGHT_AVG_INTEGRATION: '1'
      VITE_STORYFORGE_AVG_MEDIA_PRODUCTION: '1'
      VITE_STORYFORGE_AVG_VOICE_PRODUCTION: '1'
      VITE_STORYFORGE_AVG_VISUAL_PLANNING: '1'
      VITE_STORYFORGE_AVG_SOUND_PREPARATION: '0'
      VITE_STORYFORGE_AVG_SOUND_PRODUCTION: '0'
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 2

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      - name: 验证本地声音加工原生路径
        id: avg-audio-processing
        env:
          VITE_STORYFORGE_AVG_AUDIO_PROCESSING: '1'
          PLAYWRIGHT_JSON_OUTPUT_FILE: test-results/avg-media/audio-processing/report.json
        run: npm run ci:e2e -- -- --project=chromium tests/e2e/avg-audio-processing.spec.ts tests/e2e/avg-voice-workbench.spec.ts tests/e2e/avg-voice-production.spec.ts --grep 'native PCM gain|native V2 audio resamples|explicit audio processing controls|native processed voice' --reporter=github,json --output test-results/avg-media/audio-processing

      - name: 验证声音需求默认关闭与明确清除
        id: avg-sound-closed
        env:
          PLAYWRIGHT_JSON_OUTPUT_FILE: test-results/avg-media/sound-closed/report.json
        run: npm run ci:e2e -- -- --project=chromium tests/e2e/avg-sound-requirements.spec.ts --reporter=github,json --output test-results/avg-media/sound-closed

      - name: 验证声音需求编辑与保存边界
        id: avg-sound-preparation
        env:
          VITE_STORYFORGE_AVG_SOUND_PREPARATION: '1'
          VITE_STORYFORGE_AVG_SOUND_PRODUCTION: '0'
          PLAYWRIGHT_JSON_OUTPUT_FILE: test-results/avg-media/sound-preparation/report.json
        run: npm run ci:e2e -- -- --project=chromium tests/e2e/avg-sound-requirements.spec.ts --reporter=github,json --output test-results/avg-media/sound-preparation

      - name: 验证原生声音生产审听与联合预览
        id: avg-sound-production
        env:
          VITE_STORYFORGE_AVG_SOUND_PREPARATION: '1'
          VITE_STORYFORGE_AVG_SOUND_PRODUCTION: '1'
          PLAYWRIGHT_JSON_OUTPUT_FILE: test-results/avg-media/sound-production/report.json
          AVG_SOUND_RELEASE_BACKUP_FILE: test-results/avg-media/sound-production/original-sound-native-release.json
          AVG_SOUND_PUBLISHER_RELEASE_BACKUP_FILE: test-results/avg-media/sound-production/publisher-original-release.json
        run: npm run ci:e2e -- -- --project=chromium tests/e2e/avg-sound-production.spec.ts --reporter=github,json --output test-results/avg-media/sound-production

      - name: 验证声音工厂关闭后的原版本恢复与播放
        id: avg-sound-frozen
        env:
          VITE_STORYFORGE_AVG_SOUND_PREPARATION: '0'
          VITE_STORYFORGE_AVG_SOUND_PRODUCTION: '0'
          PLAYWRIGHT_JSON_OUTPUT_FILE: test-results/avg-media/sound-frozen/report.json
          AVG_SOUND_RELEASE_BACKUP_FILE: test-results/avg-media/sound-production/original-sound-native-release.json
          AVG_SOUND_PUBLISHER_RELEASE_BACKUP_FILE: test-results/avg-media/sound-production/publisher-original-release.json
        run: npm run ci:e2e -- -- --project=chromium tests/e2e/avg-sound-prototype-read.spec.ts --reporter=github,json --output test-results/avg-media/sound-frozen

      - name: 验证全部 AVG 原生路径（含图片与配音实验）
        env:
          PLAYWRIGHT_JSON_OUTPUT_FILE: test-results/avg-media/all/report.json
          AVG_VISUAL_RELEASE_BACKUP_FILE: test-results/avg-media/visual-release.json
        run: npm run ci:e2e -- -- --project=chromium tests/e2e/avg- --reporter=github,json --output test-results/avg-media/all

      - name: 验证专业视觉工厂关闭后的原图加工图版本恢复
        id: avg-visual-frozen
        if: always()
        env:
          VITE_STORYFORGE_AVG_MEDIA_PRODUCTION: '0'
          VITE_STORYFORGE_AVG_VISUAL_PLANNING: '0'
          PLAYWRIGHT_JSON_OUTPUT_FILE: test-results/avg-media/visual-frozen/report.json
          AVG_VISUAL_RELEASE_BACKUP_FILE: test-results/avg-media/visual-release.json
        run: npm run ci:e2e -- -- --project=chromium tests/e2e/avg-visual-prototype-read.spec.ts --reporter=github,json --output test-results/avg-media/visual-frozen

      - name: 核验专业视觉原生发布与关闭恢复的实际报告
        if: always()
        run: node scripts/check-avg-visual-release-ci-reports.mjs test-results/avg-media

      - name: 验证同作品九媒资组合制作与独立发布
        id: avg-combined-production
        env:
          VITE_STORYFORGE_AVG_SOUND_PREPARATION: '1'
          VITE_STORYFORGE_AVG_SOUND_PRODUCTION: '1'
          PLAYWRIGHT_JSON_OUTPUT_FILE: test-results/avg-media/combined-production/report.json
          AVG_COMBINED_RELEASE_BACKUP_FILE: test-results/avg-media/combined-release.json
        run: npm run ci:e2e -- -- --project=chromium tests/e2e/avg-combined-media-production.spec.ts --reporter=github,json --output test-results/avg-media/combined-production

      - name: 验证全部工厂关闭后的同一九媒资成功备份
        id: avg-combined-frozen
        if: always()
        env:
          VITE_STORYFORGE_AVG_MEDIA_PRODUCTION: '0'
          VITE_STORYFORGE_AVG_VISUAL_PLANNING: '0'
          VITE_STORYFORGE_AVG_VOICE_PRODUCTION: '0'
          VITE_STORYFORGE_AVG_SOUND_PREPARATION: '0'
          VITE_STORYFORGE_AVG_SOUND_PRODUCTION: '0'
          PLAYWRIGHT_JSON_OUTPUT_FILE: test-results/avg-media/combined-frozen/report.json
          AVG_COMBINED_RELEASE_BACKUP_FILE: test-results/avg-media/combined-release.json
        run: npm run ci:e2e -- -- --project=chromium tests/e2e/avg-combined-prototype-read.spec.ts --reporter=github,json --output test-results/avg-media/combined-frozen

      - name: 核验九媒资组合实际执行与同一成功备份消费
        if: always()
        run: node scripts/check-avg-combined-ci-reports.mjs test-results/avg-media

      - name: 核验声音模式实际执行及报告留存
        if: always()
        run: node scripts/check-avg-sound-ci-reports.mjs test-results/avg-media

      - name: 保存 AVG 浏览器验收证据
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: avg-media-browser-evidence
          path: test-results/avg-media/
          if-no-files-found: warn
          retention-days: 7
