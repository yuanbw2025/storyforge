name: Build Desktop and Android Clients
on:
  pull_request:
    paths:
      - 'android/**'
      - 'scripts/desktop/**'
      - 'scripts/distribution/**'
      - 'src/lib/platform/**'
      - 'src/lib/feedback/**'
      - 'src/lib/diagnostics/**'
      - 'src/components/shared/FailureFeedbackPanel.tsx'
      - 'src/components/settings/ClientPrivacyPanel.tsx'
      - 'src/components/settings/ClientAgreement.tsx'
      - 'src/main.tsx'
      - 'src/components/settings/ClientUpdatePanel.tsx'
      - 'capacitor.config.json'
      - 'electron-builder.config.cjs'
      - 'package*.json'
      - 'playwright.clients.config.ts'
      - 'tests/e2e/client-support.spec.ts'
      - 'tests/regression/R-CLIENT-LEGAL1-consent.test.tsx'
      - '.github/workflows/clients.yml'
  workflow_dispatch:
  workflow_call:
    inputs:
      release:
        type: boolean
        default: false
    secrets:
      ANDROID_KEYSTORE_BASE64:
        required: false
      ANDROID_KEYSTORE_PASSWORD:
        required: false
      ANDROID_KEY_ALIAS:
        required: false
      ANDROID_KEY_PASSWORD:
        required: false
      CSC_LINK:
        required: false
      CSC_KEY_PASSWORD:
        required: false
permissions:
  contents: read
env:
  PREVIOUS_CLIENT_REF: eb1fb49d3d99d15f7c212960ba1b97e88afd0713
  PREVIOUS_CLIENT_VERSION: 4.0.3
  # Public build-time coordinates only. The sharing UI stays hidden until the
  # production service is verified and STORYFORGE_COMMUNITY_SHARING is set to 1.
  VITE_STORYFORGE_COMMUNITY_SHARING: ${{ vars.STORYFORGE_COMMUNITY_SHARING }}
  VITE_STORYFORGE_COMMUNITY_API_URL: ${{ vars.STORYFORGE_COMMUNITY_API_URL }}
  VITE_STORYFORGE_COMMUNITY_SUPABASE_URL: ${{ vars.STORYFORGE_COMMUNITY_SUPABASE_URL }}
  VITE_STORYFORGE_COMMUNITY_SUPABASE_PUBLISHABLE_KEY: ${{ vars.STORYFORGE_COMMUNITY_SUPABASE_PUBLISHABLE_KEY }}
jobs:
  consent:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run build:portable -- --outDir dist-client-verification
      - run: npx playwright install --with-deps chromium
      - name: Verify unified packaged startup agreement
        run: npx playwright test --config playwright.clients.config.ts
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: client-consent-test-results
          path: test-results/
          retention-days: 14
  windows:
    runs-on: windows-latest
    env:
      # Retained acceptance evidence includes paths beyond Windows MAX_PATH.
      # Apply only to this job's Git processes, without changing global config.
      GIT_CONFIG_COUNT: '1'
      GIT_CONFIG_KEY_0: core.longpaths
      GIT_CONFIG_VALUE_0: 'true'
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run test:clients
      - run: npm run build:windows
        env:
          CSC_LINK: ${{ secrets.CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.CSC_KEY_PASSWORD }}
      - name: Launch packaged app in an isolated profile
        run: node scripts/desktop/smoke.mjs release/windows/win-unpacked/StoryForge.exe
      - uses: actions/checkout@v7
        with:
          ref: ${{ env.PREVIOUS_CLIENT_REF }}
          path: previous-client
      - name: Build the previous Windows client for a real installer upgrade
        working-directory: previous-client
        run: |
          npm ci
          npm run build:windows
      - name: Verify Windows installer replacement and production backup restore
        shell: bash
        run: |
          node scripts/desktop/build-upgrade-fixture.mjs
          version=$(node -p "require('./package.json').version")
          node scripts/desktop/upgrade-smoke.mjs "previous-client/release/windows/StoryForge-$PREVIOUS_CLIENT_VERSION-windows-x64-setup.exe" "release/windows/StoryForge-$version-windows-x64-setup.exe" "$PREVIOUS_CLIENT_VERSION"
      - uses: actions/upload-artifact@v4
        with:
          name: client-windows
          path: |
            release/windows/*.exe
            release/windows/*.blockmap
            release/windows/latest.yml
          if-no-files-found: error
          retention-days: 14
  macos:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-15
            arch: arm64
            directory: mac-arm64
          - os: macos-15-intel
            arch: x64
            directory: mac
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run build:macos -- --${{ matrix.arch }}
        env:
          # The full TypeScript graph exceeds the hosted Mac default V8 heap.
          NODE_OPTIONS: --max-old-space-size=4096
      - name: Launch packaged Mac application
        run: node scripts/desktop/smoke.mjs release/macos/${{ matrix.directory }}/StoryForge.app/Contents/MacOS/StoryForge
      - uses: actions/checkout@v7
        with:
          ref: ${{ env.PREVIOUS_CLIENT_REF }}
          path: previous-client
      - name: Build a previous-version Mac application with the same storage identity
        working-directory: previous-client
        env:
          NODE_OPTIONS: --max-old-space-size=4096
        run: |
          npm ci
          npm run build:portable
          node scripts/distribution/notices.mjs
          npx electron-builder --config electron-builder.config.cjs --mac dir --${{ matrix.arch }} --publish never --config.mac.identity=- --config.mac.notarize=false
      - name: Verify DMG replacement and production backup restore
        run: |
          node scripts/desktop/build-upgrade-fixture.mjs
          version=$(node -p "require('./package.json').version")
          node scripts/desktop/upgrade-smoke.mjs previous-client/release/windows/${{ matrix.directory }}/StoryForge.app "release/macos/StoryForge-$version-macos-${{ matrix.arch }}.dmg" "$PREVIOUS_CLIENT_VERSION"
      - uses: actions/upload-artifact@v4
        with:
          name: client-macos-${{ matrix.arch }}
          path: release/macos/*.dmg
          if-no-files-found: error
          retention-days: 14
  android:
    permissions:
      contents: write # Read maintainer-signed APKs from the unpublished release.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21
      - uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools platforms;android-36 build-tools;35.0.0'
      - run: npm ci
      - run: npm run build:android:web
      - name: Build isolated debug APK
        if: ${{ !inputs.release }}
        run: node scripts/distribution/build-android.mjs
      - name: Build with the permanent APK signing key
        if: ${{ inputs.release }}
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ -z "$ANDROID_KEYSTORE_BASE64" ]; then
            version=$(node -p "require('./package.json').version")
            mkdir -p release/android
            gh release download "v$version" --pattern "StoryForge-$version-android.apk" --dir release/android
            "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --print-certs "release/android/StoryForge-$version-android.apk" > "$RUNNER_TEMP/apk-certificate.txt"
            grep -q '4bc440d0734135945d9cc143bb45723fa750e1a6d03bfb9753c165e9c3c056f0' "$RUNNER_TEMP/apk-certificate.txt"
            "$ANDROID_HOME/build-tools/35.0.0/aapt" dump badging "release/android/StoryForge-$version-android.apk" | head -1 > "$RUNNER_TEMP/apk-version.txt"
            grep -q "name='com.storyforge.client'" "$RUNNER_TEMP/apk-version.txt"
            grep -q "versionName='$version'" "$RUNNER_TEMP/apk-version.txt"
            exit 0
          fi
          export ANDROID_KEYSTORE_PATH="$RUNNER_TEMP/storyforge-release.jks"
          trap 'rm -f "$ANDROID_KEYSTORE_PATH"' EXIT
          printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 --decode > "$ANDROID_KEYSTORE_PATH"
          chmod 600 "$ANDROID_KEYSTORE_PATH"
          node scripts/distribution/build-android.mjs --release
      - uses: actions/upload-artifact@v4
        with:
          name: client-android
          path: release/android/*.apk
          if-no-files-found: error
          retention-days: 14
      - name: Enable emulator acceleration
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Verify the actual Android WebView and stable storage
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          arch: x86_64
          target: google_apis
          disable-animations: true
          script: cd android && ./gradlew :app:connectedDebugAndroidTest --no-daemon
      - name: Preserve Android device test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: android-device-test-results
          path: android/app/build/reports/androidTests/connected/
          if-no-files-found: ignore
          retention-days: 14
