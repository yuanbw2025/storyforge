name: Build and test Arch Linux client
on:
  workflow_dispatch:
  workflow_call:
permissions:
  contents: read
jobs:
  arch:
    runs-on: ubuntu-latest
    timeout-minutes: 50
    env:
      VITE_STORYFORGE_COMMUNITY_SHARING: ${{ vars.STORYFORGE_COMMUNITY_SHARING }}
      VITE_STORYFORGE_COMMUNITY_API_URL: ${{ vars.STORYFORGE_COMMUNITY_API_URL }}
      VITE_STORYFORGE_COMMUNITY_SUPABASE_URL: ${{ vars.STORYFORGE_COMMUNITY_SUPABASE_URL }}
      VITE_STORYFORGE_COMMUNITY_SUPABASE_PUBLISHABLE_KEY: ${{ vars.STORYFORGE_COMMUNITY_SUPABASE_PUBLISHABLE_KEY }}
      VITE_STORYFORGE_COMMUNITY_R2_ORIGIN: ${{ vars.STORYFORGE_COMMUNITY_R2_ORIGIN }}
      VITE_STORYFORGE_COMMUNITY_R2_BUCKET: ${{ vars.STORYFORGE_COMMUNITY_R2_BUCKET }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: node --test scripts/desktop/*updater.test.mjs
      - run: npm run build:linux
      - uses: actions/checkout@v7
        with:
          ref: 41a6e8652499e0805f44798fbd54ca39d3c51234
          path: previous-client
      - run: npm ci
        working-directory: previous-client
      - name: Prepare exact previous producer and public Arch package
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          node scripts/desktop/build-upgrade-fixture.mjs
          node scripts/desktop/build-upgrade-fixture.mjs previous-client release/test-fixtures/native-upgrade-old.js 4.0.8
          mkdir -p release/arch/previous
          gh release download v4.0.8 --repo "$GITHUB_REPOSITORY" --pattern 'StoryForge-4.0.8-arch-x64.pkg.tar.zst' --dir release/arch/previous
          echo 'c6a52a9381cc1da76527086f10253058ac8963dc616cf86fb054fe2504fb8c97  release/arch/previous/StoryForge-4.0.8-arch-x64.pkg.tar.zst' | sha256sum --check
      - name: Build package and exercise the installed desktop in Arch Linux
        run: |
          docker run --rm --cap-add=SYS_ADMIN --security-opt seccomp=unconfined --shm-size=2g \
            -e STORYFORGE_PREVIOUS_VERSION=4.0.8 \
            -e STORYFORGE_PREVIOUS_SOURCE=41a6e8652499e0805f44798fbd54ca39d3c51234 \
            -e STORYFORGE_CURRENT_SOURCE="$(git rev-parse HEAD)" \
            -v "$PWD:/workspace" -w /workspace archlinux:base-devel \
            bash scripts/distribution/arch/test-package.sh
      - name: Preserve Arch package verification
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: arch-test-results
          path: |
            release/arch/test-environment.txt
            release/arch/test-result.txt
            release/arch/package.sha256
            release/arch/upgrade-*
            release/native-smoke/
          if-no-files-found: ignore
          retention-days: 14
      - uses: actions/upload-artifact@v4
        with:
          name: client-arch-x64
          path: release/arch/*.pkg.tar.zst
          if-no-files-found: error
          retention-days: 14
