name: Refresh README star history

on:
  workflow_dispatch:
  schedule:
    - cron: '7,22,37,52 * * * *'

permissions:
  contents: write

concurrency:
  group: readme-star-history
  cancel-in-progress: true

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24

      - name: Generate current star history
        run: node scripts/generate-star-history.mjs /tmp/storyforge-star-history.svg
        env:
          GITHUB_TOKEN: ${{ github.token }}

      - name: Publish README asset
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail

          branch='readme-assets'
          asset_path='storyforge-star-history.svg'
          repository="${GITHUB_REPOSITORY}"

          if ! gh api "repos/${repository}/git/ref/heads/${branch}" >/dev/null 2>&1; then
            gh api --method POST "repos/${repository}/git/refs" \
              -f ref="refs/heads/${branch}" \
              -f sha="${GITHUB_SHA}" >/dev/null
          fi

          current_sha="$(gh api "repos/${repository}/contents/${asset_path}?ref=${branch}" --jq '.sha' 2>/dev/null || true)"
          if [[ -n "${current_sha}" ]]; then
            gh api "repos/${repository}/contents/${asset_path}?ref=${branch}" --jq '.content' \
              | tr -d '\n' \
              | base64 --decode \
              | cmp -s - /tmp/storyforge-star-history.svg && {
                echo 'Star history is already current.'
                exit 0
              }
          fi

          content="$(base64 -w 0 /tmp/storyforge-star-history.svg)"
          if [[ -n "${current_sha}" ]]; then
            gh api --method PUT "repos/${repository}/contents/${asset_path}" \
              -f message='chore(readme): refresh star history' \
              -f content="${content}" \
              -f branch="${branch}" \
              -f sha="${current_sha}" >/dev/null
          else
            gh api --method PUT "repos/${repository}/contents/${asset_path}" \
              -f message='chore(readme): initialize star history' \
              -f content="${content}" \
              -f branch="${branch}" >/dev/null
          fi
