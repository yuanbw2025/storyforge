name: Optional full delivery validation

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened, labeled]

permissions:
  contents: read

concurrency:
  group: delivery-validation-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  delivery:
    if: contains(github.event.pull_request.labels.*.name, 'full-delivery')
    name: Full delivery / ${{ matrix.id }}
    runs-on: ubuntu-latest
    timeout-minutes: ${{ matrix.timeout }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - id: cli
            script: ci
            # Coverage runs files serially in fresh processes; all cases and
            # their individual performance/timeout gates remain unchanged.
            # The exact-head 2026-10-20 CI coverage step took 243.4 minutes
            # for 6980 tests; allow the full command, without changing tests.
            timeout: 360
          - id: browser
            script: ci:e2e
            timeout: 180
    env:
      CI: "true"
      PLAYWRIGHT_FROZEN_WORKSPACE: "1"
      PLAYWRIGHT_PORT: "56846"
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.head.sha }}
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - name: Record exact source
        run: git rev-parse HEAD
      - name: Install dependencies
        run: npm ci
      - name: Install browser and system dependencies
        if: matrix.id == 'browser'
        run: npx playwright install --with-deps chromium
      - name: Run complete delivery command
        run: npm run ${{ matrix.script }}
      - name: Preserve browser failure evidence
        if: ${{ !cancelled() && matrix.id == 'browser' }}
        uses: actions/upload-artifact@v4
        with:
          name: delivery-${{ matrix.id }}-${{ github.event.pull_request.head.sha }}
          path: |
            test-results/
            playwright-report/
          if-no-files-found: ignore
          retention-days: 14
