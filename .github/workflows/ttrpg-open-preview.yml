name: TTRPG open preview

on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/ttrpg-open-preview.yml'
      - 'package*.json'
      - 'playwright.config.ts'
      - 'vite.config.ts'
      - 'scripts/serve-e2e-snapshot.mjs'
      - 'src/lib/ttrpg/**'
      - 'src/components/ttrpg/**'
      - 'src/pages/TtrpgPage.tsx'
      - 'src/pages/PlaySessionPage.tsx'
      - 'src/lib/product/**'
      - 'src/lib/product-production/**'
      - 'src/lib/world-engine/**'
      - 'src/lib/db/**'
      - 'src/lib/registry/**'
      - 'src/lib/types/**'
      - 'src/lib/agent/**'
      - 'src/lib/context-gateway/**'
      - 'src/lib/export/**'
      - 'src/lib/platform/**'
      - 'tests/e2e/ttrpg-*.spec.ts'
      - 'tests/helpers/**'
      - 'tests/fixtures/**'
  push:
    branches: [main]
    paths:
      - '.github/workflows/ttrpg-open-preview.yml'
      - 'package*.json'
      - 'playwright.config.ts'
      - 'vite.config.ts'
      - 'scripts/serve-e2e-snapshot.mjs'
      - 'src/lib/ttrpg/**'
      - 'src/components/ttrpg/**'
      - 'src/pages/TtrpgPage.tsx'
      - 'src/pages/PlaySessionPage.tsx'
      - 'src/lib/product/**'
      - 'src/lib/product-production/**'
      - 'src/lib/world-engine/**'
      - 'src/lib/db/**'
      - 'src/lib/registry/**'
      - 'src/lib/types/**'
      - 'src/lib/agent/**'
      - 'src/lib/context-gateway/**'
      - 'src/lib/export/**'
      - 'src/lib/platform/**'
      - 'tests/e2e/ttrpg-*.spec.ts'
      - 'tests/helpers/**'
      - 'tests/fixtures/**'

permissions:
  contents: read

concurrency:
  group: ttrpg-open-preview-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  open-preview:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      VITE_ENABLE_TTRPG_OPEN_PREVIEW: '1'
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium
      - name: Open preview and memory receipt browser paths
        run: npm run ci:e2e -- -- tests/e2e/ttrpg-open-*.spec.ts tests/e2e/ttrpg-memory-receipt.spec.ts --workers=1
      - name: Preserve browser evidence
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: ttrpg-open-preview-${{ github.run_id }}-${{ github.run_attempt }}
          path: test-results/
          if-no-files-found: ignore
          retention-days: 7
